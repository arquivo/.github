# Reusable workflow: automated versioning and GitHub Release via semantic-release.
# A .releaserc.js in the calling repo overrides the Arquivo default.
# Usage in caller:
#   jobs:
#     release:
#       uses: arquivo/.github/.github/workflows/semantic-release.yml@main
#       secrets: inherit

name: Semantic Release

on:
  workflow_call:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Download default Arquivo releaserc if not present
        run: |
          if [[ ! -f .releaserc.js ]]; then
            echo "Downloading default Arquivo semantic-release config"
            wget --no-verbose -O .releaserc.js \
              https://raw.githubusercontent.com/arquivo/.github/main/.releaserc.js
          fi

      - name: Install semantic-release
        run: |
          npm install --no-package-lock \
            semantic-release \
            @semantic-release/changelog \
            @semantic-release/git \
            conventional-changelog-conventionalcommits

      - name: Run semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
